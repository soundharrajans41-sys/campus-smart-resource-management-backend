# ==========================================
# CSRM BACKEND - APPLICATION CONFIGURATION
# ==========================================

# Server Port (Railway automatically sets PORT)
server.port=${PORT:8080}

# ==========================================
# MYSQL DATABASE
# ==========================================
# Supports Railway MySQL variables (MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD)
# or SPRING_DATASOURCE_URL, or defaults to localhost for local development
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:csrm}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:tiger}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# JWT
# ==========================================
jwt.secret=${JWT_SECRET:csrm-secret-key-for-jwt-signing-minimum-32-characters-long}
jwt.expiration=${JWT_EXPIRATION:86400000}