# ==========================================
# CSRM BACKEND - APPLICATION CONFIGURATION
# ==========================================

# Server
server.port=8080


# ==========================================
# MYSQL DATABASE
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/csrm?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=tiger


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ==========================================
# JWT
# ==========================================

jwt.secret=csrm-secret-key-for-jwt-signing-minimum-32-characters-long

jwt.expiration=86400000